<section class="login-page">
  <div class="login-shell">
    <div class="login-card" [class.is-loading]="loading()">
      <div class="brand" aria-label="ShopSmart brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L20 6H6"></path>
          </svg>
        </div>
        <div>
          <h2>ShopSmart</h2>
          <p>Modern Commerce</p>
        </div>
      </div>

      <div class="heading">
        <h1>Welcome Back</h1>
        <p>Sign in to continue shopping</p>
      </div>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (errorMessage()) {
          <div class="alert error" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <label class="field">
          <span>Email address</span>
          <div class="input-wrap" [class.invalid]="emailControl.touched && emailControl.invalid">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"></path>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
            <input
              formControlName="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
          @if (emailControl.touched && emailControl.hasError('required')) {
            <small class="helper error">Email is required.</small>
          }
          @if (emailControl.touched && emailControl.hasError('email')) {
            <small class="helper error">Please enter a valid email address.</small>
          }
        </label>

        <label class="field">
          <span>Password</span>
          <div class="input-wrap" [class.invalid]="passwordControl.touched && passwordControl.invalid">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="4" y="10" width="16" height="10" rx="2"></rect>
              <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
            </svg>
            <input
              formControlName="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
          </div>
          @if (passwordControl.touched && passwordControl.hasError('required')) {
            <small class="helper error">Password is required.</small>
          }
        </label>

        <div class="row-between">
          <label class="checkbox">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>
          <a class="link" href="#">Forgot password?</a>
        </div>

        <button class="submit-btn" type="submit" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <span class="spinner" aria-hidden="true"></span>
          }
          <span>{{ loading() ? 'Signing In...' : 'Sign In' }}</span>
        </button>

        <div class="divider">
          <span>OR</span>
        </div>

        <div class="socials">
          <button class="social-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M21.6 12.23c0-.73-.06-1.43-.18-2.1H12v3.98h5.4a4.62 4.62 0 0 1-2 3.04v2.52h3.24c1.9-1.75 2.98-4.33 2.98-7.44Z"></path>
              <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.43l-3.24-2.52c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.58A10 10 0 0 0 12 22Z"></path>
              <path fill="#FBBC05" d="M6.41 13.89A6.02 6.02 0 0 1 6.41 10.1V7.52H3.07a10 10 0 0 0 0 12.74l3.34-2.37Z"></path>
              <path fill="#EA4335" d="M12 6.08c1.47 0 2.8.5 3.84 1.49l2.88-2.88A9.95 9.95 0 0 0 12 2a10 10 0 0 0-8.93 5.52l3.34 2.58C7.2 7.84 9.4 6.08 12 6.08Z"></path>
            </svg>
            Continue with Google
          </button>
          <button class="social-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#2563EB" d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm0 2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H6Zm2.5 3.5h2.5v2.5H8.5V8.5Zm0 4h2.5v4H8.5v-4Zm4-4h2.5v2.5H12.5V8.5Zm0 4h2.5v4H12.5v-4Z"></path>
            </svg>
            Continue with Microsoft
          </button>
        </div>

        <p class="footer-text">
          Don’t have an account?
          <a class="link" routerLink="/register">Create Account</a>
        </p>
      </form>
    </div>
  </div>
</section>
